<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>طبيبي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060912;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: "Segoe UI", "Cairo", "Tajawal", sans-serif;
    color: #fff;
    user-select: none;
    -webkit-app-region: drag;
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .logo-circle {
    width: 96px;
    height: 96px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    box-shadow: 0 8px 40px rgba(124, 58, 237, 0.5);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 40px rgba(124,58,237,0.5); }
    50% { box-shadow: 0 8px 60px rgba(124,58,237,0.9); }
  }
  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .sub {
    font-size: 14px;
    color: #8b8fa8;
    margin-top: -8px;
  }
  .bar-wrap {
    margin-top: 48px;
    width: 200px;
    height: 3px;
    background: #1a1f35;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #4f46e5);
    border-radius: 999px;
    animation: load 1.1s ease-in-out infinite;
  }
  @keyframes load {
    0%   { width: 0%;   margin-left: 0%; }
    50%  { width: 60%;  margin-left: 20%; }
    100% { width: 0%;   margin-left: 100%; }
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-circle">🩺</div>
    <h1>طبيبي</h1>
    <p class="sub">منصة الرعاية الصحية</p>
  </div>
  <div class="bar-wrap"><div class="bar"></div></div>
</body>
</html>
